name: Add security scan tools: CodeQL + PHPStan + Psalm with report outputs

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main, feature/security-scan-v9 ]

jobs:
  codeql-analysis:
    name: CodeQL
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v2
        with:
          languages: php

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v2

  phpstan-analysis:
    name: PHPStan Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Install dependencies
        run: |
          composer install --prefer-dist --no-progress

      - name: Run PHPStan
        run: |
          mkdir -p build/reports
          vendor/bin/phpstan analyse --error-format=table > build/reports/phpstan.txt || true

      - name: Upload PHPStan report
        uses: actions/upload-artifact@v4
        with:
          name: phpstan-report
          path: build/reports/phpstan.txt

  psalm-analysis:
    name: Security Scan / PHPStan & Psalm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Install dependencies
        run: |
          composer install --prefer-dist --no-progress

      - name: Run Psalm
        run: |
          mkdir -p build/reports
          vendor/bin/psalm --output-format=console > build/reports/psalm.txt || true

      - name: Upload Psalm report
        uses: actions/upload-artifact@v4
        with:
          name: psalm-report
          path: build/reports/psalm.txt
