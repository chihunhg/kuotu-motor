name: Security Scan

on:
  push:
    branches: [main, master, feature/security-scan-v9]
  pull_request:
    branches: [main, master]

jobs:
  scan:
    runs-on: ubuntu-latest

    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - name: Confirm PHP version
        run: php -v

      - name: Install dependencies
        run: composer update --no-progress --prefer-dist

      # CodeQL ¤ÀªR
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: php

      - name: Autobuild (for CodeQL)
        uses: github/codeql-action/autobuild@v3

      - name: Run CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:php"

      # PHPStan ¤ÀªR
      - name: Run PHPStan
        run: |
          mkdir -p security-report
          vendor/bin/phpstan analyse --no-progress --error-format=table > security-report/phpstan.txt || true

      # Psalm ¤ÀªR
      - name: Run Psalm
        run: |
          vendor/bin/psalm --output-format=console > security-report/psalm.txt || true

      - name: Upload report artifacts
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: security-report/
