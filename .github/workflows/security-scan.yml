name: Security Scan

on:
  push:
    branches: [main, master, feature/security-scan-v9]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  actions: read

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - name: Confirm PHP version
        run: php -v

      - name: Install dependencies (ignore platform check)
        run: composer install --prefer-dist --no-progress --ignore-platform-reqs

      # PHPStan 靜態分析
      - name: Run PHPStan
        run: |
          mkdir -p security-report
          (vendor/bin/phpstan analyse --no-progress --error-format=table || true) > security-report/phpstan.txt

      # Psalm 靜態分析
      - name: Run Psalm
        run: |
          (vendor/bin/psalm --output-format=console || true) > security-report/psalm.txt

      # 檢查報表檔案
      - name: List report files
        run: ls -al security-report/

      # 上傳報告供 GitHub 下載
      - name: Upload security scan reports
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: security-report/
