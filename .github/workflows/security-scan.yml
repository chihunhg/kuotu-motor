name: Security Scan

on:
  push:
    branches: [main, master, feature/security-scan-v9]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - name: Confirm PHP version
        run: php -v

      - name: Install dependencies (ignore platform check)
        run: composer install --prefer-dist --no-progress --ignore-platform-reqs

      # ? CodeQL 掃描流程
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: php

      - name: Autobuild (for CodeQL)
        uses: github/codeql-action/autobuild@v3

      - name: Run CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:php"

      # ? PHPStan 靜態分析
      - name: Run PHPStan
        run: |
          mkdir -p security-report
          vendor/bin/phpstan analyse --no-progress --error-format=table > security-report/phpstan.txt || true

      # ? Psalm 靜態分析
      - name: Run Psalm
        run: |
          vendor/bin/psalm --output-format=console > security-report/psalm.txt || true

      # ? 上傳分析報告
      - name: Upload security scan reports
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: security-report/
