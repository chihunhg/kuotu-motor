name: Security Scan (CodeQL + PHPStan + Psalm)

on:
  push:
    branches: [ main, feature/** ]
  pull_request:

jobs:
  security-scan:
    name: Run CodeQL + PHPStan + Psalm
    runs-on: ubuntu-latest

    permissions:
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml
          tools: composer:v2
          coverage: none

      - name: Confirm PHP version
        run: php -v

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist

      ### ? CodeQL 掃描
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: php

      - name: Autobuild project
        uses: github/codeql-action/autobuild@v3

      - name: Run CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: security

      ### ? PHPStan 分析
      - name: Run PHPStan
        run: |
          mkdir -p build/reports
          vendor/bin/phpstan analyse --no-progress --error-format=table > build/reports/phpstan-report.txt || true

      ### ? Psalm 分析
      - name: Run Psalm
        run: |
          vendor/bin/psalm --output-format=console > build/reports/psalm-report.txt || true

      ### ? 上傳報表（供後續下載或儲存）
      - name: Upload scan reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: build/reports
