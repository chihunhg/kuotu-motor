name: Security Scan (PHPStan + Psalm)

on:
  push:
    branches: [ "feature/security-scan-v9" ]
  pull_request:
    branches: [ "main" ]

jobs:
  phpstan:
    runs-on: ubuntu-latest
    name: PHPStan Static Analysis
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2

      - name: Install dependencies
        run: composer install --no-progress --no-suggest

      - name: Run PHPStan
        run: |
          mkdir -p build/reports
          vendor/bin/phpstan analyse --error-format=table > build/reports/phpstan.txt || true

      - name: Upload PHPStan report
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-reports
          path: build/reports/phpstan.txt

  psalm:
    runs-on: ubuntu-latest
    name: Psalm Static Analysis
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2

      - name: Install dependencies
        run: composer install --no-progress --no-suggest

      - name: Run Psalm
        run: |
          mkdir -p build/reports
          vendor/bin/psalm --output-format=console > build/reports/psalm.txt || true

      - name: Upload Psalm report
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-reports
          path: build/reports/psalm.txt
