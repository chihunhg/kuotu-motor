name: Add security scan tools: CodeQL + PHPStan + Psalm with report outputs

on:
  push:
    branches: [feature/security-scan-v9]
  pull_request:
    branches: [main]

jobs:
  security-scan:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php-version: ['8.2']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none

      - name: Install dependencies
        run: |
          composer install --prefer-dist --no-progress || composer update --prefer-dist --no-progress

      # 🔎 CodeQL v3 掃描
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: php

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

      # 🧠 PHPStan 掃描
      - name: Run PHPStan with report output
        run: |
          mkdir -p build/reports
          vendor/bin/phpstan analyse --no-progress > build/reports/phpstan.txt || true

      # 🔍 Psalm 掃描
      - name: Run Psalm with report output
        run: |
          mkdir -p build/reports
          vendor/bin/psalm --output-format=compact > build/reports/psalm.txt || true

      - name: Upload report artifacts
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-reports
          path: build/reports/
