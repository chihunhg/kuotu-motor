name: Security Scan

on:
  push:
    branches: [main, master, feature/security-scan-v9]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - name: Confirm PHP version
        run: php -v

      - name: Install dependencies (ignore platform check)
        run: composer install --prefer-dist --no-progress --ignore-platform-reqs

      # ? 確認工具是否存在
      - name: Check tools installed
        run: ls -al vendor/bin

      # ? CodeQL 掃描
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          config-file: ./.codeql/config.yml

      - name: Autobuild (for CodeQL)
        uses: github/codeql-action/autobuild@v3

      - name: Run CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:php"

      # ? PHPStan 分析（掃描 src/ app/）
      - name: Run PHPStan
        run: |
          mkdir -p security-report
          (vendor/bin/phpstan analyse src app --no-progress --error-format=table || true) > security-report/phpstan.txt

      # ? Psalm 分析（掃描 src/ app/）
      - name: Run Psalm
        run: |
          (vendor/bin/psalm --output-format=console src app || true) > security-report/psalm.txt

      - name: Upload security scan reports
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: security-report/
