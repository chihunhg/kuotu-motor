name: Security Scan / PHPStan & Psalm

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  php_static_analysis:
    name: PHPStan Static Analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Install dependencies
        run: |
          composer install --no-progress --prefer-dist

      - name: Run PHPStan
        run: |
          mkdir -p build/reports/phpstan
          ./vendor/bin/phpstan analyse --memory-limit=1G --error-format=table > build/reports/phpstan/output.txt || true

      - name: Run Psalm
        run: |
          mkdir -p build/reports/psalm
          ./vendor/bin/psalm --output-format=console --report=build/reports/psalm/report.xml || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis-reports
          path: build/reports/
